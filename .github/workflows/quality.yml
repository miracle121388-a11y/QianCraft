name: quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: qiancraft
          auto-activate: false
          environment-file: environment.yml
      - name: Python tests
        run: conda run --no-capture-output -n qiancraft python -m pytest -q
      - name: Ruff
        if: runner.os == 'Linux'
        run: conda run --no-capture-output -n qiancraft ruff check .
      - name: Python dependency audit
        if: runner.os == 'Linux'
        run: conda run --no-capture-output -n qiancraft python -m pip_audit --local
      - name: Locked dependency graph
        if: runner.os == 'Linux'
        run: conda run --no-capture-output -n qiancraft uv lock --check

  workbench:
    name: Workbench · Windows canonical visual gate
    needs: python
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: "true"
      QIANCRAFT_CONDA_ENV: qiancraft
      QIANCRAFT_CONTINUOUS_COLLECTION: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: qiancraft
          auto-activate: false
          environment-file: environment.yml
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: Install Web dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm --dir web install --frozen-lockfile
      - name: Workbench unit and static gates
        shell: bash
        run: |
          pnpm --dir web audit --audit-level=high
          pnpm --dir web test
          pnpm --dir web typecheck
          pnpm --dir web lint
          pnpm --dir web build
      - name: Install canonical browser
        shell: bash
        run: pnpm --dir web exec playwright install chromium
      - name: Desktop browser gate
        shell: bash
        env:
          QIANCRAFT_TOOL_WORKSPACE_DIR: ${{ runner.temp }}\qiancraft-tool-workspace
        run: pnpm --dir web exec playwright test --project=desktop-chromium
      - name: Repository and deployment script checks
        shell: bash
        run: |
          bash -n deploy/start-zeabur.sh
          git diff --check
